name: Stdlib runtime compatibility
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  runtime:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # PRs run one Ubuntu lane; pushes to main retain the full matrix.
      matrix: ${{ github.event_name == 'pull_request' && fromJSON('{"os":["ubuntu-latest"],"python":["3.14"]}') || fromJSON('{"os":["ubuntu-latest"],"python":["3.11","3.12","3.13","3.14"],"include":[{"os":"windows-latest","python":"3.11"},{"os":"windows-latest","python":"3.14"},{"os":"macos-15-intel","python":"3.11"},{"os":"macos-latest","python":"3.14"}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python }}"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Exercise runtime behavior without site-packages
        run: python -S -m unittest discover -s tests -p test_nvd_nist_known_vulns.py -v

  portability:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Locked development (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Sync locked development environment
        run: uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
      - name: Run portability tests with raw JUnit
        env:
          PYTHONPATH: build/shared
        run: uv run --locked pytest -q --junitxml=reports/portability-${{ matrix.os }}.xml
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-portability-${{ matrix.os }}
          path: reports/portability-${{ matrix.os }}.xml
          if-no-files-found: error
          retention-days: 14

  portability-identity:
    needs: portability
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@0361d4d81add261ba15073fc32f2a524d2b7e2de
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["junit-portability-windows-latest/portability-windows-latest.xml","junit-portability-macos-latest/portability-macos-latest.xml"]'
      artifact-pattern: "junit-portability-*"
      output-artifact: "portability-identity"
