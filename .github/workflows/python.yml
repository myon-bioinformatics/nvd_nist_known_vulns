name: Python
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77

  resolve-vendor:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Check out the pinned vendor placement tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify vendored bytes and fixed-commit placement
        shell: bash
        run: |
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          rm vendor/xprobe_pytest.py vendor/xprobe-LICENSE
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Stage canonical vendor evidence
        if: always()
        shell: bash
        run: >-
          python -S .vendor-sync-tools/vendor_stage.py
          --manifest vendor.lock.json --kind locked --output build/vendor-evidence-candidate
      - name: Preserve resolved vendor snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-snapshot
          path: build/vendor-evidence-candidate
          if-no-files-found: error
          retention-days: 14

  test:
    if: needs.changes.outputs.product_changed == 'true'
    needs: [changes, resolve-vendor]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Require supported Node in parity CI
        run: node -e "if (+process.versions.node.split('.')[0] < 24) process.exit(1)"
      - name: Install test-only dependencies
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "${{ matrix.python-version }}"
          activate-environment: true
          enable-cache: false
      - name: Check out the pinned vendor placement tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Download resolved vendor snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vendor-snapshot
          path: .
      - name: Verify resolved vendor snapshot
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Load verified vendored GHI (stdlib only)
        run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('enrolled_ghi','vendor/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
      - run: python -S -m py_compile nvd_nist_known_vulns.py
      - run: python -S -m unittest discover -s tests -v

      - name: Sync locked development environment
        shell: bash
        run: uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
      - name: Record native pytest outcomes and JUnit
        run: uv run --locked pytest tests -p vendor.xprobe_pytest --xprobe-jsonl=reports/pytest-events.jsonl --xprobe-repository=myon-bioinformatics/nvd_nist_known_vulns --junitxml=reports/pytest-${{ matrix.python-version }}.xml
      - name: Preserve native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-events-py${{ matrix.python-version }}
          path: reports/pytest-events.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Stage canonical vendor evidence
        if: always()
        shell: bash
        run: >-
          python -S .vendor-sync-tools/vendor_stage.py
          --manifest vendor.lock.json --kind locked --output build/vendor-evidence-test
      - name: Preserve vendor lock used by this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-lock-py${{ matrix.python-version }}
          path: build/vendor-evidence-test
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, test]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["junit-py3.11/pytest-3.11.xml","junit-py3.12/pytest-3.12.xml","junit-py3.13/pytest-3.13.xml","junit-py3.14/pytest-3.14.xml"]'
      artifact-pattern: "junit-py*"
      output-artifact: "failure-identity"
