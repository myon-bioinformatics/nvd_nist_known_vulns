name: Python
on:
  pull_request:
  workflow_dispatch:
    inputs:
      vendor-mode:
        description: Public vendor placement mode for this CI run
        type: choice
        options: [update, locked]
        default: update
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  resolve-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check out the pinned vendor placement tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 37f30d5acdc1906d4acbd103ce6f652bc13ca7eb
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify vendored bytes and fixed-commit placement
        shell: bash
        run: |
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          rm vendor/xprobe_pytest.py vendor/xprobe-LICENSE
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Update public vendor files for this run
        shell: bash
        if: inputs.vendor-mode != 'locked'
        run: |
          python -S .vendor-sync-tools/vendor_sync.py update --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Preserve resolved vendor snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-snapshot
          path: |
            vendor.lock.json
            vendor/
          if-no-files-found: error
          retention-days: 14

  test:
    needs: resolve-vendor
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check out the pinned vendor placement tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 37f30d5acdc1906d4acbd103ce6f652bc13ca7eb
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Download resolved vendor snapshot
        uses: actions/download-artifact@v8
        with:
          name: vendor-snapshot
          path: .
      - name: Verify resolved vendor snapshot
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - run: python -S -m py_compile nvd_nist_known_vulns.py
      - run: python -S -m unittest discover -s tests -v

      - name: Install test-only dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Record native pytest outcomes and JUnit
        run: python -m pytest tests -p vendor.xprobe_pytest --xprobe-jsonl=reports/pytest-events.jsonl --xprobe-repository=myon-bioinformatics/nvd_nist_known_vulns --junitxml=reports/pytest-${{ matrix.python-version }}.xml
      - name: Preserve native observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-events-py${{ matrix.python-version }}
          path: reports/pytest-events.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve vendor lock used by this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-lock-py${{ matrix.python-version }}
          path: |
            vendor.lock.json
            vendor/
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: test
    if: always()
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@4dfda95d6573250477f991a0421fa6acb9bc0258
    with:
      expected-reports: '["junit-py3.9/pytest-3.9.xml","junit-py3.10/pytest-3.10.xml","junit-py3.11/pytest-3.11.xml","junit-py3.12/pytest-3.12.xml","junit-py3.13/pytest-3.13.xml","junit-py3.14/pytest-3.14.xml"]'
      artifact-pattern: "junit-py*"
      output-artifact: "failure-identity"
